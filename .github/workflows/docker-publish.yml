name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/386
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bmc-log-analyzer:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/bmc-log-analyzer:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=bmc-log-analyzer
            org.opencontainers.image.description=BMC日志解析+异常检测+LLM根因分析工具
            org.opencontainers.image.source=https://github.com/yeshunyu/bmc-log-analyzer
            org.opencontainers.image.revision=${{ github.sha }}
