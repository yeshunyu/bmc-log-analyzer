name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.23)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v --tb=short

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            suffix: -amd64
          - platform: linux/arm64
            suffix: -arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          INPUT_VERSION: '${{ github.event.inputs.version }}'
          REF_NAME: '${{ github.ref_name }}'
          USERNAME: '${{ secrets.DOCKER_HUB_USERNAME }}'
          SUFFIX: '${{ matrix.suffix }}'
        run: |
          VERSION=""
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$REF_NAME" ] && [[ "$REF_NAME" == v* ]]; then
            VERSION="$REF_NAME"
          fi

          TAGS="${USERNAME}/bmc-log-analyzer:latest${SUFFIX}"
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS\n${USERNAME}/bmc-log-analyzer:${VERSION}${SUFFIX}"
          fi
          printf "tags<<EOF\n$TAGS\nEOF\n" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.event.inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.title=bmc-log-analyzer
            org.opencontainers.image.description=BMC日志解析+异常检测+LLM根因分析工具
            org.opencontainers.image.source=https://github.com/yeshunyu/bmc-log-analyzer
            org.opencontainers.image.revision=${{ github.sha }}
