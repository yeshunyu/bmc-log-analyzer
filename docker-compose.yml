# 支持 linux/amd64 和 linux/arm64 架构
# x86 服务器使用 -amd64 后缀，ARM 服务器或 Apple Silicon Mac 使用 -arm64 后缀
services:
  bmc-analyzer:
    image: yuyeshun2/bmc-log-analyzer:v0.50rc2-amd64  # x86 用 -amd64，ARM 服务器或 Apple Silicon 用 -arm64
    container_name: bmc-log-analyzer
    ports:
      - "8000:8000"
    # 可选：API 认证密钥（不配置则无需认证）
    # environment:
    #   - API_KEY=your-secret-key
    restart: unless-stopped
