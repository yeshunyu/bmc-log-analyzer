<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMC 日志分析</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #fff; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .header-row { display: flex; align-items: center; justify-content: space-between; }

    .btn { display: inline-block; padding: 0.5rem 1.25rem; border-radius: 6px; border: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .upload-zone { border: 2px dashed #374151; border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 1.5rem; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #3b82f6; background: rgba(59,130,246,0.05); }
    .upload-zone input { display: none; }
    .upload-zone .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .upload-zone p { color: #9ca3af; font-size: 0.9rem; }
    .upload-zone .hint { font-size: 0.8rem; color: #6b7280; margin-top: 0.5rem; }

    .loading { display: none; text-align: center; padding: 2rem; color: #9ca3af; }
    .loading.show { display: block; }

    .results { display: none; }
    .results.show { display: block; }

    .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 10px; padding: 1rem 1.25rem; }
    .card .label { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .card .value { font-size: 1.75rem; font-weight: 700; }
    .card .value.error { color: #ef4444; }
    .card .value.warning { color: #f59e0b; }
    .card .value.info { color: #3b82f6; }
    .card .value.neutral { color: #9ca3af; }

    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .chart { background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 10px; padding: 1rem; }
    .chart-title { font-size: 0.85rem; color: #9ca3af; margin-bottom: 0.75rem; }
    #timelineChart { width: 100%; height: 320px; }
    #pieChart { width: 100%; height: 280px; }

    .tabs { display: flex; gap: 0.25rem; margin-bottom: 0.75rem; border-bottom: 1px solid #2d2f3d; }
    .tab { padding: 0.5rem 1rem; font-size: 0.85rem; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s; }
    .tab:hover { color: #9ca3af; }
    .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .search-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center; }
    .search-bar input {
      flex: 1; min-width: 160px; background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 6px;
      padding: 0.5rem 0.75rem; color: #e0e0e0; font-size: 0.875rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: #3b82f6; }
    .search-bar input::placeholder { color: #6b7280; }
    .filter-group { display: flex; gap: 0.35rem; align-items: center; }
    .filter-group label { font-size: 0.75rem; color: #6b7280; white-space: nowrap; }
    .filter-group input[type="datetime-local"] {
      background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 6px;
      padding: 0.4rem 0.5rem; color: #e0e0e0; font-size: 0.8rem; outline: none;
      transition: border-color 0.2s; width: 165px;
    }
    .filter-group input[type="datetime-local"]:focus { border-color: #3b82f6; }
    .level-filters { display: flex; gap: 0.35rem; }
    .level-filters .cb-wrapper { position: relative; }
    .level-filters input[type="checkbox"] { display: none; }
    .level-filters label {
      display: inline-block; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem;
      font-weight: 600; cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
    }
    .level-filters label.lv-error { background: rgba(239,68,68,0.1); color: #ef4444; border-color: #3d3232; }
    .level-filters label.lv-warning { background: rgba(245,158,11,0.1); color: #f59e0b; border-color: #3d3830; }
    .level-filters label.lv-info { background: rgba(59,130,246,0.1); color: #3b82f6; border-color: #2d3447; }
    .level-filters input:checked + label.lv-error { background: rgba(239,68,68,0.25); border-color: #ef4444; }
    .level-filters input:checked + label.lv-warning { background: rgba(245,158,11,0.25); border-color: #f59e0b; }
    .level-filters input:checked + label.lv-info { background: rgba(59,130,246,0.25); border-color: #3b82f6; }
    .level-filters label:hover { opacity: 0.85; }
    .regex-toggle { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .regex-toggle input { accent-color: #3b82f6; width: 14px; height: 14px; }
    .regex-toggle span { font-size: 0.75rem; color: #6b7280; }
    .page-size-select { background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 6px; padding: 0.4rem 0.5rem; color: #e0e0e0; font-size: 0.8rem; outline: none; }
    .page-size-select:focus { border-color: #3b82f6; }
    .page-info { font-size: 0.8rem; color: #6b7280; margin-left: auto; white-space: nowrap; }
    .pagination { display: flex; gap: 0.25rem; align-items: center; margin-top: 0.5rem; }
    .pagination button {
      padding: 0.3rem 0.6rem; background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 5px;
      color: #9ca3af; font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
    }
    .pagination button:hover:not(:disabled) { border-color: #3b82f6; color: #3b82f6; }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
    .pagination .page-numbers { display: flex; gap: 0.2rem; }
    .pagination .page-num {
      min-width: 32px; text-align: center;
    }
    .pagination .page-num.active { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #3b82f6; }
    .pagination .gap { color: #4b5563; font-size: 0.8rem; padding: 0 0.1rem; }

    .anomaly-item { background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .anomaly-item.ERROR { border-left: 3px solid #ef4444; }
    .anomaly-item.WARNING { border-left: 3px solid #f59e0b; }
    .anomaly-item.INFO { border-left: 3px solid #3b82f6; }
    .anomaly-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .anomaly-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .badge-ERROR { background: rgba(239,68,68,0.15); color: #ef4444; }
    .badge-WARNING { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-INFO { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .anomaly-title { font-weight: 600; font-size: 0.9rem; }
    .anomaly-meta { font-size: 0.75rem; color: #6b7280; margin-bottom: 0.5rem; }
    .anomaly-count { font-size: 0.8rem; color: #9ca3af; }
    .anomaly-entries { margin-top: 0.5rem; }
    .entry-item { font-size: 0.8rem; color: #9ca3af; padding: 0.3rem 0; border-bottom: 1px solid #2d2f3d; word-break: break-all; }
    .entry-item:last-child { border-bottom: none; }
    .entry-ts { color: #6b7280; margin-right: 0.5rem; font-family: monospace; }
    .entry-msg { color: #d1d5db; }
    .anomaly-card-actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; align-items: center; }
    .btn-llm-single {
      padding: 0.35rem 0.85rem; background: #7c3aed; color: #fff; border: none;
      border-radius: 5px; font-size: 0.8rem; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-llm-single:hover { opacity: 0.8; }
    .btn-llm-single:disabled { opacity: 0.4; cursor: not-allowed; }
    .llm-card-result { margin-top: 0.6rem; font-size: 0.82rem; line-height: 1.65; color: #d1d5db; white-space: pre-wrap; background: #0f1117; border: 1px solid #2d2f3d; border-radius: 6px; padding: 0.75rem; display: none; }
    .llm-card-result.show { display: block; }
    .llm-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(124,58,237,0.3); border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .llm-section { margin-top: 1.5rem; }
    .llm-btn { background: #7c3aed; }
    .llm-btn:hover { opacity: 0.85; }
    .llm-result { background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 10px; padding: 1.25rem; margin-top: 1rem; font-size: 0.875rem; line-height: 1.7; color: #d1d5db; white-space: pre-wrap; }

    /* Settings gear icon */
    .gear-btn {
      background: none; border: none; cursor: pointer; font-size: 1.25rem;
      color: #6b7280; padding: 0.25rem; border-radius: 6px; transition: color 0.2s, background 0.2s;
    }
    .gear-btn:hover { color: #e0e0e0; background: #1a1d27; }

    /* Modal overlay */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #1a1d27; border: 1px solid #2d2f3d; border-radius: 12px;
      padding: 1.75rem; width: 480px; max-width: 95vw;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .modal h2 { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 1.25rem; border-left: 3px solid #3b82f6; padding-left: 0.5rem; }
    .modal .field { margin-bottom: 1rem; }
    .modal label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 0.35rem; }
    .modal input {
      width: 100%; background: #0f1117; border: 1px solid #374151; border-radius: 6px;
      padding: 0.5rem 0.75rem; color: #e0e0e0; font-size: 0.875rem; outline: none;
      transition: border-color 0.2s;
    }
    .modal input:focus { border-color: #3b82f6; }
    .modal .provider-toggle { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .modal .provider-btn {
      flex: 1; padding: 0.5rem; border: 1px solid #374151; border-radius: 6px;
      background: #0f1117; color: #9ca3af; font-size: 0.85rem; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .modal .provider-btn.active { border-color: #3b82f6; color: #3b82f6; background: rgba(59,130,246,0.1); }
    .modal .provider-btn:hover:not(.active) { border-color: #6b7280; }
    .modal .custom-fields { display: none; }
    .modal .custom-fields.show { display: block; }
    .modal .row { display: flex; gap: 0.5rem; }
    .modal .row .field { flex: 1; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; }
    .modal .btn-cancel { background: #374151; color: #9ca3af; }
    .modal .btn-cancel:hover { opacity: 0.8; }
    .modal .btn-save { background: #3b82f6; color: #fff; }
    .modal .btn-save:hover { opacity: 0.85; }
    .modal .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal .current-provider { font-size: 0.75rem; color: #6b7280; margin-bottom: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <h1>🔍 BMC 日志分析工具</h1>
    <button class="gear-btn" id="settingsBtn" title="LLM 设置">⚙️</button>
  </div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".log,.txt,.gz,.tar.gz">
    <div class="icon">📂</div>
    <p>点击或拖拽上传 BMC 日志文件</p>
    <div class="hint">支持 .log .txt .gz .tar.gz</div>
  </div>

  <div class="loading" id="loading">
    <p>🌀 分析中，请稍候...</p>
  </div>

  <div class="results" id="results">
    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="card"><div class="label">总事件数</div><div class="value neutral" id="totalCount">-</div></div>
      <div class="card"><div class="label">ERROR</div><div class="value error" id="errorCount">-</div></div>
      <div class="card"><div class="label">WARNING</div><div class="value warning" id="warningCount">-</div></div>
      <div class="card"><div class="label">规则异常</div><div class="value error" id="ruleCount">-</div></div>
      <div class="card"><div class="label">统计异常</div><div class="value warning" id="statCount">-</div></div>
    </div>

    <!-- LLM Analysis (global) -->
    <div class="llm-section" id="globalLlM">
      <button class="btn btn-primary llm-btn" id="llmBtn" disabled>🤖 全量 LLM 根因分析</button>
      <div id="llmResult" class="llm-result" style="display:none"></div>
    </div>

    <!-- Charts -->
    <div class="chart-grid">
      <div class="chart">
        <div class="chart-title">异常时间线</div>
        <div id="timelineChart"></div>
      </div>
      <div class="chart">
        <div class="chart-title">模块分布</div>
        <div id="pieChart"></div>
      </div>
    </div>

    <!-- Anomaly Details -->
    <div class="tabs">
      <div class="tab active" data-tab="rule">规则异常</div>
      <div class="tab" data-tab="stat">统计异常</div>
      <div class="tab" data-tab="all">全部事件</div>
    </div>

    <div class="tab-content active" id="tab-rule"></div>
    <div class="tab-content" id="tab-stat"></div>
    <div class="tab-content" id="tab-all">
      <div class="search-bar">
        <input type="text" id="logSearch" placeholder="搜索日志内容、模块名... (回车搜索)" />
        <button class="btn btn-primary" id="searchBtn" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">🔍 搜索</button>
        <label class="regex-toggle"><input type="checkbox" id="regexMode" /><span>.* 正则</span></label>
        <div class="filter-group">
          <label>从</label>
          <input type="datetime-local" id="timeFrom" />
        </div>
        <div class="filter-group">
          <label>至</label>
          <input type="datetime-local" id="timeTo" />
        </div>
        <div class="level-filters">
          <div class="cb-wrapper">
            <input type="checkbox" id="lv-err" value="ERROR" checked />
            <label for="lv-err" class="lv-error">ERROR</label>
          </div>
          <div class="cb-wrapper">
            <input type="checkbox" id="lv-warn" value="WARNING" checked />
            <label for="lv-warn" class="lv-warning">WARNING</label>
          </div>
          <div class="cb-wrapper">
            <input type="checkbox" id="lv-info" value="INFO" checked />
            <label for="lv-info" class="lv-info">INFO</label>
          </div>
        </div>
        <select class="page-size-select" id="pageSize">
          <option value="50" selected>50/页</option>
          <option value="100">100/页</option>
          <option value="200">200/页</option>
          <option value="500">500/页</option>
        </select>
        <span class="page-info" id="pageInfo"></span>
      </div>
      <div id="tab-all-entries"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>LLM 分析设置</h2>
    <div class="current-provider" id="currentProvider">当前：MiniMax（内置）</div>

    <div class="provider-toggle">
      <div class="provider-btn active" data-provider="minimax">MiniMax（内置）</div>
      <div class="provider-btn" data-provider="custom">自定义 API</div>
    </div>

    <div class="custom-fields" id="customFields">
      <div class="field">
        <label>API Base URL</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1" />
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-..." />
      </div>
      <div class="field">
        <label>模型名称</label>
        <input type="text" id="modelName" placeholder="gpt-4o / glm-4 / ..." />
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-cancel" id="cancelSettings">取消</button>
      <button class="btn btn-save" id="saveSettings">保存</button>
    </div>
  </div>
</div>

<script>
let analysisData = null;
let allEntries = []; // raw list

// ---------------------------------------------------------------------------
// Filter + Pagination state
// ---------------------------------------------------------------------------
const state = {
  search: '',
  regex: false,
  timeFrom: null,
  timeTo: null,
  levels: { ERROR: true, WARNING: true, INFO: true },
  pageSize: 50,
  page: 1,
};

// Re-render whenever any filter changes
function triggerUpdate() {
  state.page = 1;
  renderAllEntries();
  renderPagination();
}

function getFiltered() {
  const { search, regex, timeFrom, timeTo, levels } = state;
  let list = allEntries;

  // Level filter
  list = list.filter(e => levels[e.level]);

  // Time range filter
  if (timeFrom || timeTo) {
    list = list.filter(e => {
      if (!e.timestamp) return false;
      const t = new Date(e.timestamp).getTime();
      if (timeFrom && t < timeFrom) return false;
      if (timeTo && t > timeTo) return false;
      return true;
    });
  }

  // Text search
  if (search) {
    if (regex) {
      try {
        const re = new RegExp(search, 'i');
        list = list.filter(e =>
          (e.message && re.test(e.message)) ||
          (e.module && re.test(e.module)) ||
          (e.level && re.test(e.level))
        );
      } catch (_) {
        // Invalid regex — fall back to literal
        const lower = search.toLowerCase();
        list = list.filter(e =>
          (e.message && e.message.toLowerCase().includes(lower)) ||
          (e.module && e.module.toLowerCase().includes(lower)) ||
          (e.level && e.level.toLowerCase().includes(lower))
        );
      }
    } else {
      const lower = search.toLowerCase();
      list = list.filter(e =>
        (e.message && e.message.toLowerCase().includes(lower)) ||
        (e.module && e.module.toLowerCase().includes(lower)) ||
        (e.level && e.level.toLowerCase().includes(lower))
      );
    }
  }

  return list;
}

function getPaged(filtered) {
  const { pageSize, page } = state;
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  return { entries: filtered.slice(start, start + pageSize), total, totalPages, page: safePage };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderAllEntries() {
  const el = document.getElementById('tab-all-entries');
  const filtered = getFiltered();
  const { entries, total, totalPages, page } = getPaged(filtered);

  document.getElementById('pageInfo').textContent =
    total === 0 ? '' : `${total.toLocaleString()} 条 / ${totalPages} 页`;

  if (!entries.length) {
    el.innerHTML = '<p style="color:#6b7280;font-size:0.85rem">无匹配结果</p>';
    return;
  }

  el.innerHTML = entries.map(e => `
    <div class="anomaly-item ${e.level}">
      <div class="entry-item">
        <span class="entry-ts">${e.timestamp ? new Date(e.timestamp).toLocaleString('zh-CN') : ''}</span>
        <span class="anomaly-badge badge-${e.level}" style="margin-right:0.5rem">${e.level}</span>
        <span class="entry-msg">[${e.module || ''}] ${e.message || ''}</span>
        ${e.repeat_count > 1 ? `<span style="color:#f59e0b;margin-left:0.5rem">×${e.repeat_count}</span>` : ''}
      </div>
    </div>`).join('');
}

function renderPagination() {
  const container = document.getElementById('pagination');
  const filtered = getFiltered();
  const { total, totalPages, page } = getPaged(filtered);

  if (total === 0 || totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  const btns = [];
  const maxVisible = 7;
  let start = Math.max(1, page - 3);
  let end = Math.min(totalPages, start + maxVisible - 1);
  if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

  btns.push(`<button data-page="prev" ${page <= 1 ? 'disabled' : ''}>‹ 上一页</button>`);
  if (start > 1) {
    btns.push(`<button class="page-num" data-page="1">1</button>`);
    if (start > 2) btns.push(`<span class="gap">…</span>`);
  }
  for (let i = start; i <= end; i++) {
    btns.push(`<button class="page-num ${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`);
  }
  if (end < totalPages) {
    if (end < totalPages - 1) btns.push(`<span class="gap">…</span>`);
    btns.push(`<button class="page-num" data-page="${totalPages}">${totalPages}</button>`);
  }
  btns.push(`<button data-page="next" ${page >= totalPages ? 'disabled' : ''}>下一页 ›</button>`);

  container.innerHTML = btns.join('');
}

// ---------------------------------------------------------------------------
// Event listeners
// ---------------------------------------------------------------------------
document.getElementById('searchBtn').addEventListener('click', () => {
  state.search = document.getElementById('logSearch').value;
  triggerUpdate();
});

document.getElementById('logSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    state.search = e.target.value;
    triggerUpdate();
  }
});

document.getElementById('regexMode').addEventListener('change', e => {
  state.regex = e.target.checked;
  triggerUpdate();
});

document.getElementById('timeFrom').addEventListener('change', e => {
  state.timeFrom = e.target.value ? new Date(e.target.value).getTime() : null;
  triggerUpdate();
});

document.getElementById('timeTo').addEventListener('change', e => {
  state.timeTo = e.target.value ? new Date(e.target.value).getTime() : null;
  triggerUpdate();
});

['lv-err', 'lv-warn', 'lv-info'].forEach((id, idx) => {
  const level = ['ERROR', 'WARNING', 'INFO'][idx];
  document.getElementById(id).addEventListener('change', e => {
    state.levels[level] = e.target.checked;
    triggerUpdate();
  });
});

document.getElementById('pageSize').addEventListener('change', e => {
  state.pageSize = parseInt(e.target.value, 10);
  triggerUpdate();
});

document.getElementById('pagination').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  const p = btn.dataset.page;
  if (p === 'prev') state.page = Math.max(1, state.page - 1);
  else if (p === 'next') state.page = Math.min(getPaged(getFiltered()).totalPages, state.page + 1);
  else state.page = parseInt(p, 10);
  renderAllEntries();
  renderPagination();
});

// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ---------------------------------------------------------------------------
// Upload
// ---------------------------------------------------------------------------
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files;
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});

async function uploadFile(file) {
  document.getElementById('results').classList.remove('show');
  document.getElementById('loading').classList.add('show');
  document.getElementById('llmResult').style.display = 'none';
  document.getElementById('logSearch').value = '';
  document.getElementById('timeFrom').value = '';
  document.getElementById('timeTo').value = '';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/api/upload', { method: 'POST', body: formData });
    if (!resp.ok) throw new Error(await resp.text());
    analysisData = await resp.json();
    allEntries = analysisData.parsed_log.entries;
    // Reset filter state
    state.search = '';
    state.regex = false;
    state.timeFrom = null;
    state.timeTo = null;
    state.levels = { ERROR: true, WARNING: true, INFO: true };
    state.page = 1;
    document.getElementById('results').classList.add('show');
    document.getElementById('regexMode').checked = false;
    document.getElementById('lv-err').checked = true;
    document.getElementById('lv-warn').checked = true;
    document.getElementById('lv-info').checked = true;
    renderResults(analysisData);
  } catch (err) {
    alert('分析失败: ' + err.message);
  } finally {
    document.getElementById('loading').classList.remove('show');
  }
}

function renderResults(data) {
  const s = data.summary;
  document.getElementById('totalCount').textContent = s.total_entries.toLocaleString();
  document.getElementById('errorCount').textContent = s.error_count;
  document.getElementById('warningCount').textContent = s.warning_count;
  document.getElementById('ruleCount').textContent = s.rule_anomaly_count;
  document.getElementById('statCount').textContent = s.stat_anomaly_count;

  renderTimeline(data);
  renderPie(data);
  renderRuleAnomalies(data.rule_anomalies);
  renderStatAnomalies(data.statistical_anomalies);
  renderAllEntries();
  renderPagination();

  document.getElementById('llmBtn').disabled = false;
}

function renderTimeline(data) {
  const chart = echarts.init(document.getElementById('timelineChart'));
  const entries = data.parsed_log.entries.filter(e => e.timestamp && e.level === 'ERROR');
  const buckets = {};
  entries.forEach(e => {
    if (!e.timestamp) return;
    const d = new Date(e.timestamp);
    const h = (d.getMonth()+1).toString().padStart(2,'0') + '-' +
               d.getDate().toString().padStart(2,'0') + ' ' +
               d.getHours().toString().padStart(2,'0') + ':00';
    buckets[h] = (buckets[h] || 0) + 1;
  });
  const sorted = Object.entries(buckets).sort((a, b) => a[0].localeCompare(b[0]));

  chart.setOption({
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: sorted.map(x => x[0]), axisLabel: { color: '#6b7280', fontSize: 10, rotate: 30, interval: 0 }, splitLine: { show: false } },
    yAxis: { type: 'value', axisLabel: { color: '#6b7280' }, splitLine: { lineStyle: { color: '#2d2f3d' } } },
    series: [{ data: sorted.map(x => x[1]), type: 'line', smooth: true, lineStyle: { color: '#ef4444' }, itemStyle: { color: '#ef4444' }, areaStyle: { color: 'rgba(239,68,68,0.1)' } }],
    grid: { top: 10, right: 10, bottom: 50, left: 40 },
  });
}

function renderPie(data) {
  const chart = echarts.init(document.getElementById('pieChart'));
  const counts = {};
  data.parsed_log.entries.forEach(e => { if (e.module) counts[e.module] = (counts[e.module] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);

  chart.setOption({
    tooltip: { trigger: 'item' },
    series: [{
      type: 'pie', radius: ['30%', '75%'],
      data: sorted.map(([name, val]) => ({ name, value: val })),
      label: { color: '#9ca3af', fontSize: 11 },
      itemStyle: { borderRadius: 4, borderColor: '#0f1117', borderWidth: 2 },
    }],
    grid: { top: 10, right: 10, bottom: 30, left: 10 },
  });
}

function renderRuleAnomalies(anomalies) {
  const el = document.getElementById('tab-rule');
  if (!anomalies || !anomalies.length) { el.innerHTML = '<p style="color:#6b7280;font-size:0.85rem">未检测到规则异常</p>'; return; }
  el.innerHTML = anomalies.map((a, idx) => `
    <div class="anomaly-item ${a.severity}">
      <div class="anomaly-header">
        <span class="anomaly-badge badge-${a.severity}">${a.severity}</span>
        <span class="anomaly-title">${a.rule_description}</span>
      </div>
      <div class="anomaly-meta">
        ${a.first_seen ? new Date(a.first_seen).toLocaleString('zh-CN') : 'N/A'}
        ${a.last_seen && a.first_seen !== a.last_seen ? ' → ' + new Date(a.last_seen).toLocaleString('zh-CN') : ''}
      </div>
      <div class="anomaly-count">出现次数：${a.count.toLocaleString()}（采样展示${a.entries.length}条）</div>
      <div class="anomaly-entries">
        ${a.entries.slice(0, 5).map(e => `
          <div class="entry-item">
            <span class="entry-ts">${e.timestamp ? new Date(e.timestamp).toLocaleString('zh-CN') : ''}</span>
            <span class="entry-msg">${e.message}</span>
          </div>`).join('')}
      </div>
      <div class="anomaly-card-actions">
        <button class="btn-llm-single" data-type="rule" data-id="${a.rule_id}" data-desc="${a.rule_description}" data-sev="${a.severity}" data-count="${a.count}" data-idx="${idx}">
          🤖 分析此异常
        </button>
      </div>
      <div class="llm-card-result" id="llm-result-rule-${idx}"></div>
    </div>`).join('');

  // Attach per-card LLM handlers
  el.querySelectorAll('.btn-llm-single[data-type="rule"]').forEach(btn => {
    btn.addEventListener('click', () => analyzeCard(btn, 'rule'));
  });
}

function renderStatAnomalies(anomalies) {
  const el = document.getElementById('tab-stat');
  if (!anomalies || !anomalies.length) { el.innerHTML = '<p style="color:#6b7280;font-size:0.85rem">未检测到统计异常</p>'; return; }
  el.innerHTML = anomalies.map((a, idx) => `
    <div class="anomaly-item ${a.severity}">
      <div class="anomaly-header">
        <span class="anomaly-badge badge-${a.severity}">${a.severity}</span>
        <span class="anomaly-title">${a.metric === 'error_burst' ? '⚡ 错误爆发' : '🌊 重复 flood'}</span>
      </div>
      <div class="anomaly-meta">${a.window_start ? new Date(a.window_start).toLocaleString('zh-CN') : ''}</div>
      <div class="anomaly-count">${a.description}</div>
      <div class="anomaly-entries">
        ${a.entries.slice(0, 5).map(e => `<div class="entry-item"><span class="entry-ts">${e.timestamp ? new Date(e.timestamp).toLocaleString('zh-CN') : ''}</span><span class="entry-msg">${e.message}</span></div>`).join('')}
      </div>
      <div class="anomaly-card-actions">
        <button class="btn-llm-single" data-type="stat" data-id="${a.metric}" data-desc="${a.description}" data-sev="${a.severity}" data-count="${a.entries.length}" data-idx="${idx}">
          🤖 分析此异常
        </button>
      </div>
      <div class="llm-card-result" id="llm-result-stat-${idx}"></div>
    </div>`).join('');

  el.querySelectorAll('.btn-llm-single[data-type="stat"]').forEach(btn => {
    btn.addEventListener('click', () => analyzeCard(btn, 'stat'));
  });
}

// ---------------------------------------------------------------------------
// Per-card LLM analysis
// ---------------------------------------------------------------------------
async function analyzeCard(btn, type) {
  const idx = btn.dataset.idx;
  const resultEl = document.getElementById(`llm-result-${type}-${idx}`);
  const isLoading = btn.innerHTML.includes('llm-spinner');

  // Toggle: click again while loading/done collapses the result
  if (isLoading || resultEl.classList.contains('show')) {
    resultEl.classList.remove('show');
    btn.innerHTML = '🤖 分析此异常';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="llm-spinner"></span>分析中...';
  resultEl.classList.remove('show');

  try {
    const entries = type === 'rule'
      ? analysisData.rule_anomalies[idx].entries
      : analysisData.statistical_anomalies[idx].entries;

    const payload = {
      anomaly_type: type,
      rule_id: btn.dataset.id,
      rule_description: btn.dataset.desc,
      severity: btn.dataset.sev,
      count: parseInt(btn.dataset.count, 10),
      entries: entries.map(e => ({ timestamp: e.timestamp, module: e.module, level: e.level, message: e.message })),
    };

    const resp = await fetch('/api/analyze/llm-single', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    resultEl.textContent = data.summary;
    resultEl.classList.add('show');
    btn.innerHTML = '🤖 收起分析';
  } catch (err) {
    resultEl.textContent = '分析失败: ' + err.message;
    resultEl.classList.add('show');
    btn.innerHTML = '🤖 分析此异常';
  } finally {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// LLM Analysis
// ---------------------------------------------------------------------------
document.getElementById('llmBtn').addEventListener('click', async () => {
  const btn = document.getElementById('llmBtn');
  const result = document.getElementById('llmResult');
  btn.disabled = true;
  btn.textContent = '🌀 LLM 分析中...';
  result.style.display = 'none';

  try {
    const resp = await fetch('/api/analyze/llm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        anomalies: analysisData.rule_anomalies,
        statistical_anomalies: analysisData.statistical_anomalies,
        top_entries: analysisData.parsed_log.entries.filter(e => e.level === 'ERROR').slice(0, 30),
      }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    result.textContent = data.summary;
    result.style.display = 'block';
  } catch (err) {
    result.textContent = 'LLM 分析失败: ' + err.message;
    result.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 LLM 根因分析';
  }
});

// ---------------------------------------------------------------------------
// Settings Modal
// ---------------------------------------------------------------------------
const modal = document.getElementById('settingsModal');
const providerBtns = document.querySelectorAll('.provider-btn');
const customFields = document.getElementById('customFields');

function openSettings() {
  // Load current settings
  fetch('/api/analyze/llm-settings')
    .then(r => r.json())
    .then(cfg => {
      providerBtns.forEach(b => {
        b.classList.toggle('active', b.dataset.provider === cfg.provider);
      });
      customFields.classList.toggle('show', cfg.provider === 'custom');
      document.getElementById('currentProvider').textContent =
        '当前：' + (cfg.provider === 'minimax' ? 'MiniMax（内置）' : cfg.model + ' @ ' + cfg.api_base);

      // Load from localStorage for custom fields
      const saved = JSON.parse(localStorage.getItem('llm_custom') || '{}');
      if (saved.apiBase) document.getElementById('apiBase').value = saved.apiBase;
      if (saved.apiKey) document.getElementById('apiKey').value = saved.apiKey;
      if (saved.model) document.getElementById('modelName').value = saved.model;
    });
  modal.classList.add('show');
}

function closeSettings() {
  modal.classList.remove('show');
}

providerBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    providerBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    customFields.classList.toggle('show', btn.dataset.provider === 'custom');
  });
});

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('cancelSettings').addEventListener('click', closeSettings);
modal.addEventListener('click', e => { if (e.target === modal) closeSettings(); });

document.getElementById('saveSettings').addEventListener('click', async () => {
  const isCustom = document.querySelector('.provider-btn.active').dataset.provider === 'custom';
  const payload = {
    provider: isCustom ? 'custom' : 'minimax',
    api_key: isCustom ? document.getElementById('apiKey').value : '',
    api_base: isCustom ? document.getElementById('apiBase').value : 'https://api.minimax.chat/v1',
    model: isCustom ? document.getElementById('modelName').value : 'MiniMax-Text-01',
  };

  try {
    const resp = await fetch('/api/analyze/llm-settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error(await resp.text());

    // Persist custom fields locally
    if (isCustom) {
      localStorage.setItem('llm_custom', JSON.stringify({
        apiBase: payload.api_base,
        apiKey: payload.api_key,
        model: payload.model,
      }));
    } else {
      localStorage.removeItem('llm_custom');
    }

    closeSettings();
  } catch (err) {
    alert('保存失败: ' + err.message);
  }
});
</script>
